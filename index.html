<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>منصة التعلم عن بعد الشاملة</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        .auth-card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 50px;
        }

        .filter-section {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            outline: none;
        }

        .lesson-card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: 0.3s ease;
        }

        .active-lesson {
            border: 2px solid var(--success);
            background: #f0fdf4;
        }

        .progress-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: #f1f5f9;
        }

        .progress-bar {
            height: 100%;
            background: var(--success); width: 0%;
            transition: width 1s linear;
        }

        .btn {
            display: block;
            width: 100%; padding: 14px;
            border-radius: 12px; border: none; font-weight: bold;
            cursor: pointer; text-decoration: none; text-align: center;
            margin-top: 10px; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        
        .no-data { text-align: center; padding: 20px; color: #64748b; font-style: italic; }
        label { font-size: 0.8rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" class="auth-card">
        <h2>👋 مرحباً بك</h2>
        <p>أدخل الرمز للدخول (طالب: 1234 | معلم: 5678)</p>
        <input type="text" id="passCode" placeholder="أدخل الرقم هنا">
        <button class="btn btn-primary" onclick="handleLogin()">دخول النظام</button>
    </div>

    <div id="mainApp" style="display:none;">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="appTitle">تحميل...</h3>
            <button onclick="logout()" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:bold;">خروج</button>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <div>
                    <label>📅 اليوم:</label>
                    <select id="daySelect" onchange="updateUI()">
                        <option value="">---</option>
                        <option value="الأحد">الأحد</option>
                        <option value="الاثنين">الاثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                        <option value="الخميس">الخميس</option>
                    </select>
                </div>
                <div>
                    <label>🎓 الصف:</label>
                    <select id="gradeSelect" onchange="updateUI()">
                        <option value="">---</option>
                        <option value="1">الأول</option>
                        <option value="2">الثاني</option>
                        <option value="3">الثالث</option>
                        <option value="4">الرابع</option>
                        <option value="5">الخامس</option>
                        <option value="6">السادس</option>
                        <option value="7">السابع</option>
                        <option value="8">الثامن</option>
                        <option value="9">التاسع</option>
                        <option value="10">العاشر</option>
                    </select>
                </div>
            </div>

            <div id="teacherFiltersSection" style="display:none;">
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                <div class="filter-group">
                    <div>
                        <label>📚 المادة:</label>
                        <select id="subjectFilter" onchange="updateUI()">
                            <option value="">الكل</option>
                        </select>
                    </div>
                    <div>
                        <label>👨‍🏫 المعلم:</label>
                        <select id="teacherFilter" onchange="updateUI()">
                            <option value="">الكل</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="lessonsGrid"></div>
    </div>
</div>

<script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtOpsreNoUoEcco1MnGhOu4ml8F-hRvKC-2AeVAJgodZdBBJ-l9OeWG1Xu_2l_tUY-qebr1h-xEWSb/pub?gid=1011079660&single=true&output=csv';
    let rawData = [];

    // دالة شاملة لتنظيف النصوص والأرقام لضمان التطابق 100%
    function smartClean(text) {
        if (!text) return "";
        let str = text.toString().trim();
        // تحويل الأرقام العربية (١٢٣) إلى إنجليزية (123)
        const ar = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) str = str.replace(ar[i], i);
        // توحيد الهمزات والتاء المربوطة وحذف المسافات الداخلية
        return str.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/\s+/g, '');
    }

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetURL + '&t=' + Date.now());
            const data = await response.text();
            parseCSV(data);
        } catch (e) { console.error("Error loading CSV"); }
    }

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        rawData = [];
        let subjects = new Set();
        let teachers = new Set();

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length >= 7) {
                const lesson = {
                    day: cols[0].trim(),
                    grade: cols[1].trim(),
                    subject: cols[2].trim(),
                    teacher: cols[3].trim(),
                    start: cols[4].trim(),
                    end: cols[5].trim(),
                    link: cols[6].trim()
                };
                rawData.push(lesson);
                subjects.add(lesson.subject);
                teachers.add(lesson.teacher);
            }
        }
        fillDropdown('subjectFilter', subjects);
        fillDropdown('teacherFilter', teachers);
        updateUI();
    }

    function fillDropdown(id, set) {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerHTML = '<option value="">الكل</option>';
        set.forEach(v => { if(v) el.innerHTML += `<option value="${v}">${v}</option>`; });
    }

    function handleLogin() {
        const code = smartClean(document.getElementById('passCode').value);
        let role = (code === "1234") ? 'student' : (code === "5678") ? 'teacher' : '';
        if (role) {
            localStorage.setItem('user_role', role);
            startSystem();
        } else { alert("الرمز غير صحيح (استخدم 1234 أو 5678)"); }
    }

    async function startSystem() {
        const role = localStorage.getItem('user_role');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('appTitle').innerText = (role === 'teacher') ? "لوحة التحكم 👨‍🏫" : "الجدول الدراسي 🎓";
        document.getElementById('teacherFiltersSection').style.display = (role === 'teacher') ? 'block' : 'none';
        await fetchSheetData();
        setInterval(updateUI, 30000); // تحديث تلقائي كل 30 ثانية
    }

    function updateUI() {
        const grid = document.getElementById('lessonsGrid');
        const sDay = smartClean(document.getElementById('daySelect').value);
        const sGrade = smartClean(document.getElementById('gradeSelect').value);
        
        // إظهار رسالة تنبيه إذا لم يتم الاختيار
        if (!sDay || !sGrade) {
            grid.innerHTML = '<p class="no-data">يرجى اختيار اليوم والصف أولاً.</p>';
            return;
        }

        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const role = localStorage.getItem('user_role');
        const fSub = document.getElementById('subjectFilter').value;
        const fTeach = document.getElementById('teacherFilter').value;

        // الفلترة باستخدام دالة التنظيف الذكية
        let filtered = rawData.filter(item => 
            smartClean(item.day) === sDay && 
            smartClean(item.grade) === sGrade
        );

        // فلاتر إضافية للمعلم
        if (role === 'teacher') {
            if (fSub) filtered = filtered.filter(i => i.subject === fSub);
            if (fTeach) filtered = filtered.filter(i => i.teacher === fTeach);
        }

        grid.innerHTML = filtered.length ? '' : '<p class="no-data">لا توجد حصص مجدولة لهذا اليوم والصف.</p>';

        filtered.forEach(lesson => {
            const [sH, sM] = lesson.start.split(':').map(Number);
            const [eH, eM] = lesson.end.split(':').map(Number);
            const startT = sH * 60 + sM;
            const endT = eH * 60 + eM;
            const isActive = nowMins >= startT && nowMins < endT;

            const card = document.createElement('div');
            card.className = `lesson-card ${isActive ? 'active-lesson' : ''}`;
            
            let progress = '';
            if (isActive) {
                const pct = Math.min(100, Math.max(0, ((nowMins - startT) / (endT - startT)) * 100));
                progress = `<div class="progress-container"><div class="progress-bar" style="width:${pct}%"></div></div>`;
            }

            card.innerHTML = `
                ${progress}
                <h3 style="margin:0">${lesson.subject}</h3>
                <p style="color:gray; font-size:0.9rem; margin:5px 0;">👨‍🏫 ${lesson.teacher} | ⏰ ${lesson.start} - ${lesson.end}</p>
                <button class="btn btn-primary" onclick="openSession('${lesson.link}')">🚀 دخول الحصة</button>
            `;
            grid.appendChild(card);
        });
    }

    function openSession(url) {
        // تجاوز حماية الروابط وتتبع المصدر
        const win = window.open('', '_blank');
        win.opener = null;
        win.location.replace(url.trim().startsWith('http') ? url.trim() : 'https://' + url.trim());
    }

    function logout() { localStorage.clear(); location.reload(); }
    window.onload = () => { if (localStorage.getItem('user_role')) startSystem(); };
</script>
</body>
</html>
