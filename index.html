<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العنقود v3.0 - نظام التحفيز الرقمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --gold: #ffd700;
            --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --border: #e2e8f0;
        }
        .dark-mode { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3; }
        
        /* تصميم الأوسمة */
        .badge-container { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .badge-item { background: var(--card); padding: 10px 15px; border-radius: 20px; border: 2px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: bold; transition: 0.3s; }
        .badge-active { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); background: linear-gradient(145deg, #fff, #fff9e6); color: #856404; }
        .badge-locked { opacity: 0.5; filter: grayscale(1); }
        
        /* التنسيقات العامة للمنصة */
        .welcome-frame { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); padding: 10px; border-radius: 30px; margin-top: 10px; }
        .auth-card { background: var(--card); padding: 25px; border-radius: 25px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); color: var(--text); font-weight: bold; }
        .btn-main { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        .admin-table th, .admin-table td { padding: 10px; border: 1px solid var(--border); text-align: center; }
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 40px; display: flex; gap: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 2000; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="loginScreen" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="welcome-frame" style="width: 90%; max-width: 400px;">
        <div class="auth-card">
            <img src="https://github.com/Sami-ghannam/Beit-Alroosh-AlTehta-School/blob/main/logo.png?raw=true" style="width: 70px;">
            <h2 style="color: var(--primary); margin: 10px 0;">منصة العنقود v3.0</h2>
            <input type="password" id="sysPass" style="width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--border); text-align: center; margin: 20px 0; font-size: 1.2rem;" placeholder="رمز الدخول">
            <button class="btn-main btn-primary" onclick="handleLogin()">دخول</button>
        </div>
    </div>
</div>

<div id="mainApp" style="display:none; padding: 20px; max-width: 1200px; margin: auto;">
    
    <div id="gamificationSection" style="display:none;">
        <div class="badge-container">
            <div id="onTimeBadge" class="badge-item badge-locked">
                <i class="fas fa-stopwatch" style="color: var(--primary);"></i>
                <span>حصص دقيقة: <span id="onTimeCount">0</span></span>
            </div>
            <div id="commitmentBadge" class="badge-item badge-locked">
                <i class="fas fa-medal" style="color: var(--gold);"></i>
                <span>وسام الالتزام الكامل</span>
            </div>
        </div>
    </div>

    <div id="adminDashboard" style="display:none; margin-bottom: 20px;">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
            <div class="auth-card" style="padding:15px;"><small>نشطة</small><div id="actNum" style="font-size:1.5rem; font-weight:900; color:var(--success);">0</div></div>
            <div class="auth-card" style="padding:15px;"><small>إنجاز اليوم</small><div id="percNum" style="font-size:1.5rem; font-weight:900; color:var(--primary);">0%</div></div>
        </div>
        <button class="btn-main" style="background: var(--warning); color:white; margin-bottom: 10px;" onclick="generateDailyReport()">استخراج تقرير Excel</button>
    </div>

    <div class="welcome-frame">
        <div class="auth-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span id="roleLabel" style="font-weight:bold; color:var(--primary);"></span>
                <button onclick="logout()" style="background:none; border:none; color:var(--danger); font-weight:bold; cursor:pointer;">خروج</button>
            </div>
            <div class="filter-grid">
                <select id="daySelect" onchange="renderUI()"></select>
                <select id="gradeSelect" onchange="renderUI()"><option value="">كل الصفوف</option></select>
                <select id="teacherSelect" onchange="renderUI()" style="display:none;"></select>
            </div>
            <div id="listContent">جاري التحميل...</div>
        </div>
    </div>
</div>

<div id="bottomNav" class="bottom-nav">
    <div onclick="location.reload()"><i class="fas fa-sync"></i></div>
    <div onclick="showAbout()"><i class="fas fa-info-circle"></i></div>
</div>

<script>
    let data = [];
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRa-upd7Oa8Ma0r3PaX0XoZdvLhz9kkCXayodb3FDbbYT-W0k6SHC3GKN1-sXz75O7BIbE2FE5lBO-k/pub?gid=0&single=true&output=csv';
    const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];

    async function init() {
        const r = await fetch(sheetURL + '&t=' + Date.now());
        const t = await r.text();
        data = t.split('\n').slice(1).map(row => {
            const c = row.split(',');
            return { day:c[0]?.trim(), gr:c[1]?.trim(), sec:c[2]?.trim(), sub:c[3]?.trim(), tea:c[4]?.trim(), s:c[5]?.trim(), e:c[6]?.trim(), link:c[7]?.trim(), ph:c[8]?.trim() };
        });
        fillFilters();
        if(sessionStorage.getItem('logged')) showApp();
    }

    function fillFilters() {
        document.getElementById('daySelect').innerHTML = days.map(d => `<option value="${d}">${d}</option>`).join('');
        document.getElementById('daySelect').value = days[new Date().getDay()] || "الأحد";
        const gs = [...new Set(data.map(i => i.gr))].filter(x=>x).sort();
        document.getElementById('gradeSelect').innerHTML += gs.map(g => `<option value="${g}">${g}</option>`).join('');
        const ts = [...new Set(data.map(i => i.tea))].filter(x=>x).sort();
        document.getElementById('teacherSelect').innerHTML = '<option value="">المعلم</option>' + ts.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function handleLogin() {
        const p = document.getElementById('sysPass').value;
        let role = (p==="1")?'طالب':(p==="1111")?'معلم':(p==="1234")?'إدارة وإشراف':'';
        if(!role) return Swal.fire('خطأ', 'رمز غير صحيح', 'error');
        sessionStorage.setItem('logged', 'true');
        sessionStorage.setItem('role', role);
        showApp();
    }

    function showApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        const role = sessionStorage.getItem('role');
        document.getElementById('roleLabel').innerText = "بوابة " + role;
        
        if(role === 'إدارة وإشراف') {
            document.getElementById('adminDashboard').style.display = 'block';
            document.getElementById('teacherSelect').style.display = 'block';
        }
        if(role === 'معلم') {
            document.getElementById('gamificationSection').style.display = 'block';
            loadTeacherStats();
        }
        renderUI();
    }

    // منطق التحفيز: حساب الحصص الدقيقة
    function loadTeacherStats() {
        let count = parseInt(localStorage.getItem('onTimeCount') || '0');
        document.getElementById('onTimeCount').innerText = count;
        if(count > 0) document.getElementById('onTimeBadge').classList.add('badge-active');
        if(count >= 5) { // مثال: إذا أتم 5 حصص دقيقة يحصل على وسام الالتزام
             document.getElementById('commitmentBadge').classList.remove('badge-locked');
             document.getElementById('commitmentBadge').classList.add('badge-active');
        }
    }

    function recordOnTime() {
        if(sessionStorage.getItem('role') !== 'معلم') return;
        let count = parseInt(localStorage.getItem('onTimeCount') || '0');
        localStorage.setItem('onTimeCount', count + 1);
        loadTeacherStats();
        Swal.fire({ title: 'أحسنت!', text: 'تم تسجيل حصة دقيقة في رصيدك', icon: 'success', timer: 1500 });
    }

    function renderUI() {
        const area = document.getElementById('listContent');
        const role = sessionStorage.getItem('role');
        const day = document.getElementById('daySelect').value;
        const grade = document.getElementById('gradeSelect').value;
        const teacher = document.getElementById('teacherSelect').value;
        
        const now = new Date();
        const curMins = now.getHours() * 60 + now.getMinutes();

        let filtered = data.filter(i => i.day === day && (grade==="" || i.gr === grade) && (role !== 'إدارة وإشراف' || teacher==="" || i.tea === teacher));

        if(role === 'إدارة وإشراف') {
            let html = '<table class="admin-table"><thead><tr><th>الصف</th><th>المعلم</th><th>الحالة</th><th>تنبيه</th></tr></thead><tbody>';
            let act=0, done=0;
            filtered.forEach(l => {
                const sm = (l.s.split(':')[0]*60) + Number(l.s.split(':')[1]);
                const em = (l.e.split(':')[0]*60) + Number(l.e.split(':')[1]);
                let sCol = (curMins >= sm && curMins <= em) ? 'var(--success)' : (curMins > em) ? 'var(--gray)' : 'var(--danger)';
                if(curMins>=sm && curMins<=em) act++; if(curMins>em) done++;
                
                const waLink = `https://wa.me/${l.ph}?text=${encodeURIComponent('يرجى بدء حصة '+l.sub+' لصف '+l.gr)}`;
                html += `<tr><td>${l.gr}-${l.sec}</td><td>${l.tea}</td><td style="color:${sCol}; font-weight:bold">${(curMins>=sm && curMins<=em)?'نشطة':(curMins>em)?'منتهية':'انتظار'}</td>
                <td><button onclick="window.open('${waLink}')" style="background:var(--success); border:none; color:white; border-radius:5px; padding:5px;"><i class="fab fa-whatsapp"></i></button></td></tr>`;
            });
            area.innerHTML = html + '</tbody></table>';
            document.getElementById('actNum').innerText = act;
            document.getElementById('percNum').innerText = Math.round((done/filtered.length)*100 || 0) + '%';
        } else {
            area.innerHTML = '';
            filtered.forEach(l => {
                const sm = (l.s.split(':')[0]*60) + Number(l.s.split(':')[1]);
                const em = (l.e.split(':')[0]*60) + Number(l.e.split(':')[1]);
                const isOpen = (curMins >= sm - 5 && curMins <= em + 5);
                area.innerHTML += `<div class="auth-card" style="margin-bottom:10px; border-right:5px solid ${isOpen?'var(--success)':'var(--danger)'}">
                    <div style="text-align:right"><b>${l.sub}</b> | ${l.tea} | ${l.s}-${l.e}</div>
                    <button class="btn-main btn-primary" style="margin-top:10px; background:${isOpen?'':'#ccc'}" ${isOpen?'':'disabled'} 
                        onclick="if(${role==='معلم'}) recordOnTime(); window.open('${l.link}')">دخول الحصة</button>
                </div>`;
            });
        }
    }

    function generateDailyReport() {
        const day = document.getElementById('daySelect').value;
        let report = data.filter(i => i.day === day).map(l => ({ 'المعلم': l.tea, 'الصف': l.gr, 'المادة': l.sub, 'الوقت': l.s + '-' + l.e }));
        const ws = XLSX.utils.json_to_sheet(report);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "التقرير");
        XLSX.writeFile(wb, `تقرير_${day}.xlsx`);
    }

    function logout() { sessionStorage.clear(); location.reload(); }
    function showAbout() { Swal.fire('م. سامي غنام', 'الإصدار 3.0 - نظام التحفيز والإشراف الرقمي', 'info'); }

    window.onload = init;
</script>
</body>
</html>
