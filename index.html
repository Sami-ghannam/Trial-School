<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العنقود الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444;
            --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --gray: #94a3b8;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh;
        }
        
        /* --- تنسيق الاستجابة للهواتف والحاسوب --- */
        .welcome-page {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; gap: 20px; padding: 15px;
        }

        @media (min-width: 1024px) {
            .welcome-page { flex-direction: row; gap: 30px; }
        }

        .side-widget {
            width: 100%; max-width: 300px; background: white; padding: 20px; border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0;
        }

        @media (min-width: 1024px) {
            .side-widget { width: 200px; }
        }

        .welcome-frame {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            padding: 10px; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            width: 100%; max-width: 500px;
        }

        .auth-card { 
            background: var(--card); padding: 30px 20px; border-radius: 32px; 
            text-align: center; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .auth-card::before, .inner-app-content::before {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 80%; background-image: url('logo.png');
            background-size: contain; background-repeat: no-repeat; opacity: 0.04; z-index: 0; pointer-events: none;
        }

        /* تحسين النص المنحني للموبايل */
        .curved-title-container { width: 100%; height: 100px; margin-bottom: 5px; display: flex; justify-content: center; }
        .curved-svg { width: 100%; height: 100%; }
        .curved-text { font-size: 34px; font-weight: 900; fill: var(--primary); }
        @media (max-width: 480px) { .curved-text { font-size: 28px; } }

        .designer-tag { font-size: 0.9rem; color: #64748b; margin-bottom: 25px; background: #f8fafc; padding: 6px 15px; border-radius: 50px; border: 1px solid #e2e8f0; position: relative; z-index: 1; }

        input[type="text"], select { 
            width: 100%; padding: 14px; border-radius: 15px; border: 2px solid #e2e8f0; 
            margin-bottom: 12px; outline: none; text-align: center; font-size: 1rem; position: relative; z-index: 1; box-sizing: border-box;
        }

        .btn { 
            width: 100%; padding: 14px; border-radius: 15px; border: none; font-weight: bold; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            gap: 10px; margin-bottom: 10px; font-size: 1rem; transition: 0.2s; position: relative; z-index: 1;
        }
        .btn-primary { background: linear-gradient(to bottom, #3b82f6, #2563eb); color: white; box-shadow: 0 5px 0 #1d4ed8; }
        .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #1d4ed8; }

        /* --- صفحة الحصص --- */
        #mainApp { display: none; padding: 15px; width: 100%; box-sizing: border-box; }
        .inner-app-content { background: white; padding: 20px; border-radius: 35px; position: relative; min-height: 400px; }

        .lesson-card { border-radius: 18px; padding: 15px; margin-bottom: 12px; border: 2px solid transparent; position: relative; z-index: 1; }
        .state-available { background: #f0fdf4; border-color: var(--success); color: #166534; }
        .state-locked { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
        .state-ended { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

        /* جدول متجاوب */
        .table-wrapper { overflow-x: auto; margin-top: 15px; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 400px; font-size: 0.85rem; }
        .data-table th, .data-table td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; }
        
        .status-pill { padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.7rem; color: white; display: inline-block; }
        .quick-link { text-decoration: none; color: var(--text); padding: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="welcome-page">
        <div class="side-widget">
            <span style="font-size:0.75rem; color:var(--gray);">الوقت الآن</span>
            <div class="live-clock" style="font-size:1.3rem; font-weight:bold; color:var(--primary);">00:00:00</div>
            <div class="live-date" style="font-size:0.85rem; font-weight:600; color:#64748b; margin-top:5px;">--/--/----</div>
        </div>

        <div class="welcome-frame">
            <div class="auth-card">
                <div class="curved-title-container">
                    <svg viewBox="0 0 500 120" class="curved-svg">
                        <path id="curvePath" d="M 50,100 A 200,80 0 0,1 450,100" fill="none" />
                        <text class="curved-text"><textPath xlink:href="#curvePath" startOffset="50%" text-anchor="middle">منصة العنقود الرقمية</textPath></text>
                    </svg>
                </div>
                <div class="designer-tag">تصميم وبرمجة: م. سامي غنام</div>
                
                <div style="width: 100%; max-width: 280px;">
                    <input type="text" id="sysPass" placeholder="أدخل الرمز">
                    <button class="btn btn-primary" onclick="handleLogin()">
                        <i class="fas fa-sign-in-alt"></i> دخول للمنصة
                    </button>
                    
                    <div style="display:flex; justify-content:space-around; margin-top:10px; font-size: 0.85rem; position: relative; z-index: 1;">
                        <div onclick="alert('الرموز: طالب 1، معلم 1111، مشرف 1234')" style="cursor:pointer; color:var(--gray);"><i class="fas fa-info-circle"></i> التعليمات</div>
                        <div onclick="window.close()" style="cursor:pointer; color:var(--danger);"><i class="fas fa-power-off"></i> خروج</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-widget">
            <span style="font-size:0.75rem; color:var(--gray);">تواصل معنا</span>
            <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 10px;">
                <a href="https://wa.me/972568402800" class="quick-link"><i class="fab fa-whatsapp" style="color:#25D366;"></i> المطور</a>
                <a href="mailto:sami.ghannam@shebron.edu.ps" class="quick-link"><i class="fas fa-envelope" style="color:var(--danger);"></i> البريد</a>
            </div>
        </div>
    </div>
</div>

<div id="mainApp">
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 15px;">
        <div class="live-clock" style="background:white; padding:8px 15px; border-radius:50px; font-size:0.9rem; font-weight:bold; color:var(--primary); box-shadow:0 4px 10px rgba(0,0,0,0.05);"></div>
        <div class="live-date" style="background:white; padding:8px 15px; border-radius:50px; font-size:0.9rem; font-weight:bold; color:#64748b; box-shadow:0 4px 10px rgba(0,0,0,0.05);"></div>
    </div>

    <div class="welcome-frame" style="max-width: 800px; margin: 0 auto;">
        <div class="inner-app-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; position:relative; z-index:1;">
                <h4 style="margin:0; color:var(--primary);">بوابة الرقابة والتعلم</h4>
                <button onclick="location.reload()" style="border:none; background:none; color:var(--danger); font-weight:bold; cursor:pointer; font-size:0.9rem;">خروج <i class="fas fa-sign-out-alt"></i></button>
            </div>

            <div style="position:relative; z-index:1;">
                <label style="font-size:0.85rem;"><b>اليوم:</b></label>
                <select id="daySelect" onchange="updateUI()"></select>
                
                <label style="font-size:0.85rem;"><b>الصف:</b></label>
                <select id="gradeSelect" onchange="updateUI()">
                    <option value="">إختر الصف...</option>
                    <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">${i}</option>`)</script>
                </select>
            </div>

            <div id="lessonsGrid"></div>
            <div id="summaryArea"></div>
        </div>
    </div>
</div>

<script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8Yk6Sq2bCZtlrH-mgqDZFYnRc54MYf8vAW6VIpW1WHIzKi5lkoBRTXjv5i8sXBkHMrbR_KHS-kMoV/pub?gid=0&single=true&output=csv';
    let rawData = [];
    const weekDaysArr = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];

    // تعبئة قائمة الأيام
    const daySelect = document.getElementById('daySelect');
    weekDaysArr.forEach(d => { daySelect.innerHTML += `<option value="${d}">${d}</option>`; });

    function updateTime() {
        const now = new Date();
        document.querySelectorAll('.live-clock').forEach(el => el.innerText = now.toLocaleTimeString('ar-EG'));
        document.querySelectorAll('.live-date').forEach(el => el.innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'}));
    }
    setInterval(updateTime, 1000); updateTime();

    function getMins(t) { if(!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; }

    async function loadData() {
        try {
            const r = await fetch(sheetURL + '&t=' + Date.now());
            const t = await r.text();
            rawData = t.split('\n').slice(1).filter(row => row.trim() !== "").map(row => {
                const c = row.split(',');
                return { day: c[0].trim(), grade: c[1].trim(), sub: c[2].trim(), teacher: c[3].trim(), s: c[4].trim(), e: c[5].trim(), link: c[6].trim() };
            });
            updateUI();
        } catch (e) { console.error("Data Error"); }
    }

    function handleLogin() {
        const pass = document.getElementById('sysPass').value.trim();
        if (pass === "1" || pass === "1111" || pass === "1234") {
            sessionStorage.setItem('role', pass === "1234" ? 'supervisor' : 'user');
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            const today = new Date().getDay();
            if(today >= 0 && today <= 4) document.getElementById('daySelect').value = weekDaysArr[today];
            loadData();
            setInterval(updateUI, 30000);
        } else alert("الرمز غير صحيح!");
    }

    function getStatus(day, s, e) {
        const now = new Date();
        const currentDay = weekDaysArr[now.getDay()] || "الجمعة";
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const startMins = getMins(s);
        const endMins = getMins(e);
        const currentIdx = weekDaysArr.indexOf(currentDay);
        const lessonIdx = weekDaysArr.indexOf(day);

        if (currentDay === day && nowMins >= startMins && nowMins <= endMins) 
            return { text: 'جارية الآن', class: 'state-available', can: true, pill: '#10b981' };
        if (lessonIdx > currentIdx || (lessonIdx === currentIdx && nowMins < startMins))
            return { text: 'لم تبدأ', class: 'state-locked', can: false, pill: '#94a3b8' };
        return { text: 'انتهت', class: 'state-ended', can: false, pill: '#ef4444' };
    }

    function updateUI() {
        const role = sessionStorage.getItem('role');
        const day = document.getElementById('daySelect').value;
        const grade = document.getElementById('gradeSelect').value;
        const grid = document.getElementById('lessonsGrid');
        const summary = document.getElementById('summaryArea');

        let list = rawData.filter(i => i.day === day);
        let filtered = grade ? list.filter(i => i.grade === grade) : (role === 'supervisor' ? list : []);

        grid.innerHTML = (role !== 'supervisor' && !grade) ? '<p style="text-align:center; color:#94a3b8; font-size:0.9rem; margin-top:20px;">يرجى اختيار الصف</p>' : '';
        
        filtered.forEach(l => {
            const status = getStatus(l.day, l.s, l.e);
            grid.innerHTML += `
                <div class="lesson-card ${status.class}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <h4 style="margin:0; font-size:1rem;">${l.sub}</h4>
                        <span class="status-pill" style="background:${status.pill}">${status.text}</span>
                    </div>
                    <p style="margin:8px 0; font-size:0.85rem;"><b>المعلم:</b> ${l.teacher} | <b>الصف:</b> ${l.grade}</p>
                    <p style="margin:0; font-size:0.85rem;"><b>⏰ الوقت:</b> ${l.s} - ${l.e}</p>
                    ${status.can ? `<button class="btn btn-primary" style="margin-top:10px; padding:10px;" onclick="window.open('${l.link}')">دخول الحصة</button>` : ''}
                </div>`;
        });

        if (filtered.length > 0) {
            summary.innerHTML = `
            <div class="summary-area" style="margin-top:20px; border-top:3px solid var(--primary); padding-top:10px;">
                <h5 style="margin:0 0 10px 0;">📊 ملخص يوم ${day}:</h5>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr style="background:#f8fafc;"><th>المادة</th><th>البداية</th><th>الحالة</th></tr></thead>
                        <tbody>
                            ${filtered.map(l => {
                                const status = getStatus(l.day, l.s, l.e);
                                return `<tr><td>${l.sub}</td><td>${l.s}</td><td><span class="status-pill" style="background:${status.pill}">${status.text}</span></td></tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        } else summary.innerHTML = "";
    }
    
    document.getElementById('sysPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
