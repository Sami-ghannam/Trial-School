<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>منصة التعلم عن بعد</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 600px; margin: 0 auto; width: 100%; }

        .auth-card {
            background: var(--card);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 30px;
        }

        .filter-section {
            background: var(--card);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 14px;
            margin: 5px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 16px;
            background-color: #fff;
        }

        .lesson-card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .active-lesson {
            border: 2px solid var(--success);
            background: #f0fdf4;
        }

        .progress-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: #f1f5f9;
        }

        .progress-bar {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.5s ease;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
            font-size: 1rem;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }

        @media (max-width: 400px) {
            .filter-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" class="auth-card">
        <h2>👋 مرحباً بك</h2>
        <p>أدخل الرمز للدخول (طالب: 1 | معلم: 2)</p>
        <input type="text" id="passCode" placeholder="أدخل الرقم هنا">
        <button class="btn btn-primary" onclick="handleLogin()">دخول النظام</button>
    </div>

    <div id="mainApp" style="display:none;">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="appTitle">جاري التحميل...</h3>
            <button onclick="logout()" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:bold;">تسجيل الخروج</button>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <div>
                    <label style="font-size:12px; font-weight:bold;">📅 اليوم:</label>
                    <select id="daySelect" onchange="updateUI()">
                        <option value="الأحد">الأحد</option>
                        <option value="الاثنين">الاثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                        <option value="الخميس">الخميس</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:12px; font-weight:bold;">🎓 الصف:</label>
                    <select id="gradeSelect" onchange="updateUI()">
                        <option value="1">الأول</option><option value="2">الثاني</option>
                        <option value="3">الثالث</option><option value="4">الرابع</option>
                        <option value="5">الخامس</option><option value="6">السادس</option>
                        <option value="7">السابع</option><option value="8">الثامن</option>
                        <option value="9">التاسع</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="lessonsGrid"></div>
    </div>
</div>

<script>
    // رابط البيانات
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtOpsreNoUoEcco1MnGhOu4ml8F-hRvKC-2AeVAJgodZdBBJ-l9OeWG1Xu_2l_tUY-qebr1h-xEWSb/pub?gid=1011079660&single=true&output=csv';
    
    let rawData = [];

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetURL + '&t=' + new Date().getTime());
            if (!response.ok) throw new Error();
            const data = await response.text();
            parseCSV(data);
        } catch (error) {
            alert("فشل جلب البيانات. يرجى التأكد من الإنترنت.");
        }
    }

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        rawData = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length >= 7) {
                rawData.push({
                    day: cols[0].trim(),
                    grade: cols[1].trim(),
                    subject: cols[2].trim(),
                    teacher: cols[3].trim(),
                    start: cols[4].trim(),
                    end: cols[5].trim(),
                    link: cols[6].trim()
                });
            }
        }
        updateUI();
    }

    function handleLogin() {
        const input = document.getElementById('passCode').value.trim();
        let role = (input === "1") ? 'student' : (input === "2") ? 'teacher' : '';
        
        if (role) {
            // استخدام sessionStorage بدلاً من localStorage لضمان مسح البيانات عند إغلاق التبويب
            sessionStorage.setItem('user_role', role);
            startSystem();
        } else {
            alert("الرمز غير صحيح.");
        }
    }

    async function startSystem() {
        // التحقق من الجلسة الحالية
        const role = sessionStorage.getItem('user_role');
        if (!role) return;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('appTitle').innerText = (role === 'teacher') ? "لوحة المعلم" : "جدول الحصص";
        
        await fetchSheetData();
        setInterval(updateUI, 30000);
    }

    function updateUI() {
        const grid = document.getElementById('lessonsGrid');
        const day = document.getElementById('daySelect').value;
        const grade = document.getElementById('gradeSelect').value;
        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();

        const filtered = rawData.filter(l => l.day === day && l.grade === grade);
        grid.innerHTML = filtered.length ? '' : '<p style="text-align:center; padding:20px;">لا توجد دروس حالياً.</p>';

        filtered.forEach(lesson => {
            const [sH, sM] = lesson.start.split(':').map(Number);
            const [eH, eM] = lesson.end.split(':').map(Number);
            const startTotal = sH * 60 + sM;
            const endTotal = eH * 60 + eM;
            const isActive = nowMins >= startTotal && nowMins < endTotal;

            const card = document.createElement('div');
            card.className = `lesson-card ${isActive ? 'active-lesson' : ''}`;
            
            let progress = '';
            if (isActive) {
                const pct = Math.min(100, Math.max(0, ((nowMins - startTotal) / (endTotal - startTotal)) * 100));
                progress = `<div class="progress-container"><div class="progress-bar" style="width:${pct}%"></div></div>`;
            }

            card.innerHTML = `
                ${progress}
                <h3 style="margin:0; color:var(--primary);">${lesson.subject}</h3>
                <p style="margin:5px 0; font-size:0.9rem;">👨‍🏫 ${lesson.teacher} | ⏰ ${lesson.start} - ${lesson.end}</p>
                <button class="btn btn-primary" onclick="openDirect('${lesson.link}')">🚀 دخول الحصة الآن</button>
            `;
            grid.appendChild(card);
        });
    }

    function openDirect(url) {
        const finalUrl = (url.startsWith('http')) ? url : 'https://' + url;
        const newWindow = window.open();
        newWindow.opener = null;
        newWindow.location = finalUrl;
        newWindow.target = "_blank";
    }

    function logout() {
        // مسح بيانات الجلسة والعودة للبداية
        sessionStorage.clear();
        location.reload();
    }
    
    // عند تحميل الصفحة، نتحقق إذا كانت الجلسة موجودة (في حال قام المستخدم بعمل Refresh فقط)
    window.onload = () => { 
        if (sessionStorage.getItem('user_role')) {
            startSystem();
        }
    };
</script>
</body>
</html>
