<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العنقود الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444;
            --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --gray: #94a3b8;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }
        
        /* نظام توزيع الشاشة الترحيبية */
        .welcome-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 30px;
            padding: 20px;
        }

        /* البطاقات الجانبية */
        .side-widget {
            width: 200px;
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #e2e8f0;
            display: none; /* تختفي في الشاشات الصغيرة */
        }

        @media (min-width: 1100px) { .side-widget { display: block; } }

        /* إطار الشاشة الترحيبية المركزي */
        .welcome-frame {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            padding: 12px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
        }

        .auth-card { 
            background: var(--card); 
            padding: 60px 30px; 
            border-radius: 32px; 
            text-align: center; 
            position: relative;
            overflow: hidden;
        }

        /* العلامة المائية */
        .auth-card::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 380px; height: 380px;
            background-image: url('logo.png');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.07; z-index: 0; pointer-events: none;
        }

        .content-wrapper { position: relative; z-index: 1; }

        .app-name { font-size: 2.6rem; color: var(--primary); margin: 0; font-weight: 900; }
        .designer-name { 
            font-size: 0.95rem; color: #64748b; margin-bottom: 35px; 
            background: #f8fafc; display: inline-block; padding: 5px 15px; border-radius: 50px;
        }

        input[type="password"] { 
            width: 100%; padding: 16px; border-radius: 16px; border: 2px solid #cbd5e1; 
            margin: 10px 0; outline: none; text-align: center; font-size: 1.2rem;
        }

        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-available { background: var(--primary); color: white; }
        .btn-available:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37,99,235,0.3); }
        .btn-exit { background: transparent; color: #94a3b8; border: 1px solid #e2e8f0; }

        /* تنسيق الساعة والروابط */
        .widget-title { font-size: 0.8rem; color: var(--gray); margin-bottom: 10px; font-weight: bold; display: block;}
        .digital-clock { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .quick-link { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; padding: 10px; font-size: 0.9rem; border-radius: 10px; transition: 0.2s; }
        .quick-link:hover { background: #f1f5f9; color: var(--primary); }

        /* تنسيقات التطبيق الداخلي (مخفية للآن) */
        #mainApp { max-width: 900px; margin: 20px auto; padding: 20px; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="welcome-page">
        <div class="side-widget">
            <span class="widget-title"><i class="far fa-clock"></i> الوقت الحالي</span>
            <div id="clock" class="digital-clock">00:00:00</div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            <span class="widget-title"><i class="far fa-calendar-alt"></i> التاريخ</span>
            <div id="date" style="font-size: 0.9rem; font-weight: 600;">--/--/----</div>
        </div>

        <div class="welcome-frame">
            <div class="auth-card">
                <div class="content-wrapper">
                    <h1 class="app-name">منصة العنقود الرقمية</h1>
                    <div class="designer-name">تصميم وبرمجة: م. سامي غنام</div>

                    <div style="max-width: 300px; margin: 0 auto;">
                        <label style="font-weight: bold; font-size: 0.9rem; color: #475569;">كلمة المرور</label>
                        <input type="password" id="sysPass" placeholder="••••••••">
                        
                        <button class="btn btn-available" onclick="handleLogin()">
                            <i class="fas fa-sign-in-alt"></i> دخول للمنصة
                        </button>
                        
                        <button class="btn btn-exit" onclick="alert('شكراً لك')">
                            <i class="fas fa-power-off"></i> خروج
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-widget">
            <span class="widget-title"><i class="fas fa-link"></i> وصول سريع</span>
            <a href="#" class="quick-link"><i class="fab fa-whatsapp"></i> الدعم الفني</a>
            <a href="#" class="quick-link"><i class="fas fa-book"></i> تعليمات</a>
            <a href="#" class="quick-link" onclick="alert('المصمم: م. سامي غنام\nالإصدار: 2.3')"><i class="fas fa-code"></i> المطور</a>
        </div>
    </div>
</div>

<div id="mainApp" style="display:none;">
    <div style="background: white; padding: 20px; border-radius: 20px; text-align: center;">
        <h2>مرحباً بك في لوحة التحكم</h2>
        <button onclick="location.reload()" class="btn btn-exit" style="width: auto; display: inline-flex;">تسجيل خروج</button>
    </div>
</div>

<script>
    // تحديث الساعة الرقمية
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('ar-EG');
        document.getElementById('date').innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
    }
    setInterval(updateClock, 1000);
    updateClock();

    // تفعيل Enter
    document.getElementById('sysPass').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
        const code = document.getElementById('sysPass').value;
        if (["1", "1111", "1234"].includes(code)) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            // هنا يمكنك استدعاء باقي وظائف الجلب والبيانات
        } else {
            alert("خطأ في كلمة المرور");
        }
    }
</script>

</body>
</html>
