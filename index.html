<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التعلم عن بعد الشاملة</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        .auth-card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 50px;
        }

        .filter-section {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .lesson-card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: 0.3s ease;
        }

        .active-lesson {
            border: 2px solid var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
            background: #f0fdf4;
        }

        .progress-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: #f1f5f9;
        }

        .progress-bar {
            height: 100%;
            background: var(--success); width: 0%;
            transition: width 1s linear;
        }

        .btn {
            display: block;
            width: 100%; padding: 14px;
            border-radius: 12px; border: none; font-weight: bold;
            cursor: pointer; text-decoration: none; text-align: center;
            margin-top: 10px; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--primary); color: var(--primary); background: none; }

        .attendance-log {
            background: #fff;
            border-radius: 15px; padding: 15px;
            margin-top: 20px; border: 1px dashed #cbd5e1;
            max-height: 400px; overflow-y: auto;
        }
        
        label { font-size: 0.85rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" class="auth-card">
        <h2>👋 مرحباً بك</h2>
        <p>أدخل الرمز للدخول (طالب: 1 | معلم: 2)</p>
        <input type="text" id="passCode" placeholder="أدخل الرقم 1 أو 2">
        <button class="btn btn-primary" onclick="handleLogin()">دخول النظام</button>
    </div>

    <div id="mainApp" style="display:none;">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h2 id="appTitle">جاري تحميل البيانات...</h2>
            <button onclick="logout()" style="color:var(--danger); border:none; background:none; cursor:pointer;">خروج</button>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <div>
                    <label>📅 اليوم (أساسي):</label>
                    <select id="daySelect" onchange="updateUI()">
                        <option value="الأحد">الأحد</option>
                        <option value="الاثنين">الاثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                        <option value="الخميس">الخميس</option>
                    </select>
                </div>
                <div>
                    <label>🎓 الصف (أساسي):</label>
                    <select id="gradeSelect" onchange="updateUI()">
                        <option value="1">الأول</option>
                        <option value="2">الثاني</option>
                        <option value="3">الثالث</option>
                        <option value="4">الرابع</option>
                        <option value="5">الخامس</option>
                        <option value="6">السادس</option>
                        <option value="7">السابع</option>
                        <option value="8">الثامن</option>
                        <option value="9">التاسع</option>
                    </select>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

            <div class="filter-group">
                <div>
                    <label>📚 المادة:</label>
                    <select id="subjectFilter" onchange="updateUI()">
                        <option value="">--- الكل ---</option>
                    </select>
                </div>
                <div>
                    <label>👨‍🏫 المعلم:</label>
                    <select id="teacherFilter" onchange="updateUI()">
                        <option value="">--- الكل ---</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="lessonsGrid"></div>

        <div id="teacherPanel" style="display:none; margin-top: 30px;">
            <hr>
            <h3>📊 سجل الحضور الذكي</h3>
            <button class="btn btn-outline" onclick="showAttendance()">تحديث وعرض سجل الحضور</button>
            <div id="attendanceDisplay" class="attendance-log" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtOpsreNoUoEcco1MnGhOu4ml8F-hRvKC-2AeVAJgodZdBBJ-l9OeWG1Xu_2l_tUY-qebr1h-xEWSb/pub?gid=1011079660&single=true&output=csv';
    
    let rawData = [];

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetURL);
            const data = await response.text();
            parseCSV(data);
        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
            alert("فشل تحميل البيانات من Google Sheets");
        }
    }

    function parseCSV(csvText) {
        const lines = csvText.split('\n');
        rawData = [];
        let subjectsSet = new Set();
        let teachersSet = new Set();

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length >= 7) {
                const lesson = {
                    day: cols[0].trim(),
                    grade: cols[1].trim(),
                    subject: cols[2].trim(),
                    teacher: cols[3].trim(),
                    start: cols[4].trim(),
                    end: cols[5].trim(),
                    link: cols[6].trim()
                };
                rawData.push(lesson);
                subjectsSet.add(lesson.subject);
                teachersSet.add(lesson.teacher);
            }
        }
        
        populateDropdown('subjectFilter', subjectsSet);
        populateDropdown('teacherFilter', teachersSet);
        updateUI();
    }

    function populateDropdown(id, dataSet) {
        const select = document.getElementById(id);
        const currentValue = select.value;
        select.innerHTML = '<option value="">--- الكل ---</option>';
        dataSet.forEach(item => {
            select.innerHTML += `<option value="${item}">${item}</option>`;
        });
        select.value = currentValue;
    }

    function convertArabicNumbers(str) {
        const arabicNums = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return str.replace(/[٠-٩]/g, function(w) {
            return arabicNums.indexOf(w);
        });
    }

    function handleLogin() {
        const inputVal = document.getElementById('passCode').value.trim();
        const code = convertArabicNumbers(inputVal);
        
        let role = '';
        if (code === "1") role = 'student';
        else if (code === "2") role = 'teacher';

        if (role) {
            localStorage.setItem('user_role', role);
            if (role === 'student' && "Notification" in window) {
                Notification.requestPermission();
            }
            startSystem();
        } else {
            alert("الرمز غير صحيح! أدخل 1 للطالب أو 2 للمعلم.");
        }
    }

    async function startSystem() {
        const role = localStorage.getItem('user_role');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        
        if (role === 'teacher') {
            document.getElementById('teacherPanel').style.display = 'block';
            document.getElementById('appTitle').innerText = "لوحة التحكم 👨‍🏫";
        } else {
            document.getElementById('appTitle').innerText = "الجدول الدراسي";
        }

        const daysArr = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
        const today = daysArr[new Date().getDay()];
        if (daysArr.includes(today)) {
            document.getElementById('daySelect').value = today;
        }

        await fetchSheetData();
        setInterval(updateUI, 30000);
        if (role === 'student') scheduleNotifications();
    }

    function updateUI() {
        const grid = document.getElementById('lessonsGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        const selectedDay = document.getElementById('daySelect').value;
        const selectedGrade = document.getElementById('gradeSelect').value;
        const filterSubject = document.getElementById('subjectFilter').value;
        const filterTeacher = document.getElementById('teacherFilter').value;
        
        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();

        // فلترة أساسية
        let filtered = rawData.filter(item => item.day === selectedDay && item.grade === selectedGrade);

        // فلترة عرض إضافية
        if (filterSubject !== "") {
            filtered = filtered.filter(item => item.subject === filterSubject);
        }
        if (filterTeacher !== "") {
            filtered = filtered.filter(item => item.teacher === filterTeacher);
        }

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="text-align:center;">لا توجد حصص مجدولة حالياً لهذا الاختيار.</p>';
            return;
        }

        filtered.forEach(lesson => {
            const [sH, sM] = lesson.start.split(':').map(Number);
            const [eH, eM] = lesson.end.split(':').map(Number);
            const startTotal = sH * 60 + sM;
            const endTotal = eH * 60 + eM;
            const isActive = nowMins >= startTotal && nowMins < endTotal;

            const card = document.createElement('div');
            card.className = `lesson-card ${isActive ? 'active-lesson' : ''}`;
            
            let progressHtml = '';
            if (isActive) {
                const pct = ((nowMins - startTotal) / (endTotal - startTotal)) * 100;
                progressHtml = `<div class="progress-container"><div class="progress-bar" style="width:${pct}%"></div></div>`;
            }

            card.innerHTML = `
                ${progressHtml}
                <h3 style="margin:0">${lesson.subject}</h3>
                <p style="color:gray; font-size:0.9rem;">👨‍🏫 ${lesson.teacher}</p>
                <p>⏰ ${lesson.start} - ${lesson.end}</p>
                <button class="btn btn-primary" onclick="joinSession('${lesson.subject}', '${lesson.link}')">🚀 دخول الحصة</button>
            `;
            grid.appendChild(card);
        });
    }

    function joinSession(subject, url) {
        const role = localStorage.getItem('user_role');
        if (role === 'student') {
            let name = localStorage.getItem('student_name');
            if (!name) {
                name = prompt("سجل حضورك.. ادخل اسمك الثلاثي:");
                if (name) localStorage.setItem('student_name', name);
                else return;
            }
            const logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
            logs.push({ name, subject, time: new Date().toLocaleTimeString('ar-EG'), date: new Date().toLocaleDateString('ar-EG') });
            localStorage.setItem('attendance_logs', JSON.stringify(logs));
        }
        window.open(url, '_blank');
    }

    function scheduleNotifications() {
        rawData.forEach(lesson => {
            const [h, m] = lesson.start.split(':').map(Number);
            const alertTime = new Date();
            alertTime.setHours(h, m - 1, 0);
            const diff = alertTime.getTime() - new Date().getTime();
            if (diff > 0) {
                setTimeout(() => {
                    new Notification(`🔔 اقترب موعد حصة ${lesson.subject}`, { body: "ستبدأ الحصة بعد دقيقة، استعد!" });
                }, diff);
            }
        });
    }

    function showAttendance() {
