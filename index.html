<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>منصة التعلم عن بعد الشاملة</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        .auth-card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 50px;
        }

        .filter-section {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            outline: none;
        }

        .lesson-card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .active-lesson {
            border: 2px solid var(--success);
            background: #f0fdf4;
        }

        .btn {
            display: block;
            width: 100%; padding: 14px;
            border-radius: 12px; border: none; font-weight: bold;
            cursor: pointer; text-decoration: none; text-align: center;
            margin-top: 10px; font-size: 1rem;
            transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        
        .no-data { text-align: center; padding: 20px; color: #64748b; font-style: italic; }
        label { font-size: 0.8rem; font-weight: bold; color: var(--primary); }
        .timer-box { font-size: 0.85rem; font-weight: bold; color: var(--danger); margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" class="auth-card">
        <h2>👋 مرحباً بك</h2>
        <p>أدخل الرمز للدخول (طالب: 1234 | معلم: 5678)</p>
        <input type="password" id="sysPassCode" autocomplete="off" placeholder="الرمز السري">
        <button class="btn btn-primary" onclick="handleLogin()">دخول النظام</button>
    </div>

    <div id="mainApp" style="display:none;">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="appTitle">تحميل...</h3>
            <button onclick="logout()" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:bold;">تسجيل الخروج</button>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <div>
                    <label>📅 اليوم:</label>
                    <select id="daySelect" onchange="updateUI()">
                        <option value="">---</option>
                        <option value="الأحد">الأحد</option>
                        <option value="الاثنين">الاثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                        <option value="الخميس">الخميس</option>
                    </select>
                </div>
                <div>
                    <label>🎓 الصف:</label>
                    <select id="gradeSelect" onchange="updateUI()">
                        <option value="">---</option>
                        <option value="1">الأول</option>
                        <option value="2">الثاني</option>
                        <option value="3">الثالث</option>
                        <option value="4">الرابع</option>
                        <option value="5">الخامس</option>
                        <option value="6">السادس</option>
                        <option value="7">السابع</option>
                        <option value="8">الثامن</option>
                        <option value="9">التاسع</option>
                    </select>
                </div>
            </div>

            <div id="teacherFiltersSection" style="display:none;">
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                <div class="filter-group">
                    <div>
                        <label>📚 المادة:</label>
                        <select id="subjectFilter" onchange="updateUI()">
                            <option value="">الكل</option>
                        </select>
                    </div>
                    <div>
                        <label>👨‍🏫 المعلم:</label>
                        <select id="teacherFilter" onchange="updateUI()">
                            <option value="">الكل</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="lessonsGrid"></div>
    </div>
</div>

<script>
    // --- إعدادات الروابط (يجب تعبئتها من قبلك) ---
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtOpsreNoUoEcco1MnGhOu4ml8F-hRvKC-2AeVAJgodZdBBJ-l9OeWG1Xu_2l_tUY-qebr1h-xEWSb/pub?gid=1011079660&single=true&output=csv';
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSderel93nwlCLrQJW6fL6Jd6jSr4EzIjUdZes0H4otpkXfj8Q/formResponse";
    const ENTRY_NAME = "entry.1542579219";    // حقل الاسم الرباعي
    const ENTRY_GRADE = "entry.1978441942";   // حقل الصف
    const ENTRY_SUBJECT = "entry.500841186";  // حقل المادة
    const ENTRY_STATUS = "entry.1811602553"; // حقل الحالة الإدارية
    let rawData = [];

    function smartClean(text) {
        if (!text) return "";
        let str = text.toString().trim();
        const ar = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) str = str.replace(ar[i], i);
        return str.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/\s+/g, '');
    }

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetURL + '&nocache=' + new Date().getTime());
            const data = await response.text();
            parseCSV(data);
        } catch (e) { console.error("Error loading CSV"); }
    }

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        rawData = [];
        let subjects = new Set();
        let teachers = new Set();
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length >= 7) {
                const lesson = {
                    day: cols[0].trim(), grade: cols[1].trim(), subject: cols[2].trim(),
                    teacher: cols[3].trim(), start: cols[4].trim(), end: cols[5].trim(), link: cols[6].trim()
                };
                rawData.push(lesson);
                subjects.add(lesson.subject);
                teachers.add(lesson.teacher);
            }
        }
        fillDropdown('subjectFilter', subjects);
        fillDropdown('teacherFilter', teachers);
        updateUI();
    }

    function fillDropdown(id, set) {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerHTML = '<option value="">الكل</option>';
        set.forEach(v => { if(v) el.innerHTML += `<option value="${v}">${v}</option>`; });
    }

    function handleLogin() {
        const input = document.getElementById('sysPassCode');
        const code = smartClean(input.value);
        let role = (code === "1234") ? 'student' : (code === "5678") ? 'teacher' : '';
        if (role) {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('user_role', role);
            input.value = '';
            startSystem();
        } else { alert("الرمز غير صحيح!"); }
    }

    async function startSystem() {
        const role = sessionStorage.getItem('user_role');
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('appTitle').innerText = (role === 'teacher') ? "لوحة التحكم 👨‍🏫" : "الجدول الدراسي 🎓";
            document.getElementById('teacherFiltersSection').style.display = (role === 'teacher') ? 'block' : 'none';
            await fetchSheetData();
            // تحديث الواجهة كل ثانية لضمان دقة المؤقت والعد التنازلي
            setInterval(updateUI, 1000);
        } else { logout(); }
    }

    function updateUI() {
        const grid = document.getElementById('lessonsGrid');
        const sDay = smartClean(document.getElementById('daySelect').value);
        const sGrade = smartClean(document.getElementById('gradeSelect').value);
        if (!sDay || !sGrade) {
            grid.innerHTML = '<p class="no-data">يرجى اختيار اليوم والصف أولاً.</p>';
            return;
        }

        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const nowSecs = now.getSeconds();
        const role = sessionStorage.getItem('user_role');

        let filtered = rawData.filter(item => smartClean(item.day) === sDay && smartClean(item.grade) === sGrade);
        grid.innerHTML = filtered.length ? '' : '<p class="no-data">لا توجد حصص مجدولة.</p>';

        filtered.forEach(lesson => {
            const [sH, sM] = lesson.start.split(':').map(Number);
            const startMins = sH * 60 + sM;
            const openTime = startMins - 5;
            const finalDeadline = startMins + 20;

            const isCurrentlyOpen = (nowMins >= openTime && nowMins <= finalDeadline);
            let timerHTML = '';
            let btnStyle = isCurrentlyOpen ? 'btn-primary' : 'background: #cbd5e1; cursor: not-allowed;';
            let btnText = isCurrentlyOpen ? '🚀 دخول وتسجيل الحضور' : '🔒 الرابط مغلق حالياً';
            let disabledAttr = isCurrentlyOpen ? '' : 'disabled';

            if (!isCurrentlyOpen) {
                if (nowMins < openTime) {
                    const diffMins = openTime - nowMins - 1;
                    const diffSecs = 60 - nowSecs;
                    timerHTML = `<div class="timer-box">⏳ يفتح بعد: ${diffMins} د و ${diffSecs} ث</div>`;
                } else {
                    timerHTML = `<div class="timer-box">❌ انتهى وقت الدخول (مغلق)</div>`;
                }
            }

            const card = document.createElement('div');
            card.className = `lesson-card ${isCurrentlyOpen ? 'active-lesson' : ''}`;
            card.innerHTML = `
                ${timerHTML}
                <h3 style="margin:0">${lesson.subject}</h3>
                <p style="color:gray; font-size:0.9rem; margin:5px 0;">👨‍🏫 ${lesson.teacher} | ⏰ ${lesson.start}</p>
                <button class="btn" style="${btnStyle}" ${disabledAttr} 
                    onclick="openSession('${lesson.link}', '${lesson.subject}', '${lesson.grade}', '${lesson.start}')">
                    ${btnText}
                </button>
            `;
            grid.appendChild(card);
        });
    }

    function openSession(url, subject, grade, startTime) {
        const role = sessionStorage.getItem('user_role');
        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const [sH, sM] = startTime.split(':').map(Number);
        const startMins = sH * 60 + sM;
        
        const openTime = startMins - 5;
        const teacherDeadline = startMins + 15;
        const finalDeadline = startMins + 20;

        // فحص الأمان الزمني النهائي
        if (nowMins < openTime || nowMins > finalDeadline) {
            alert("عذراً، الرابط مغلق حالياً.");
            return;
        }

        if (role === 'student') {
            const name = prompt("نظام الحضور: أدخل اسمك الرباعي للدخول:");
            if (name && name.trim().length > 8) {
                sendToForm(name, grade, subject, "حضور طالب");
                proceed(url);
            } else { alert("يجب إدخال الاسم الرباعي كاملاً."); }
        } else {
            // منطق المعلم
            if (nowMins > teacherDeadline) {
                alert("تم تسجيل دخولك كمتأخر. سيتم إخطار الإدارة.");
                sendToForm("نظام آلي", grade, subject, "تأخر معلم");
            }
            proceed(url);
        }
    }

    function sendToForm(name, grade, subject, status) {
        const formData = new FormData();
        formData.append(ENTRY_NAME, name);
        formData.append(ENTRY_GRADE, grade);
        formData.append(ENTRY_SUBJECT, subject);
        formData.append(ENTRY_STATUS, status);
        fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: formData });
    }

    function proceed(url) {
        const win = window.open('', '_blank');
        win.opener = null;
        win.location.replace(url.trim().startsWith('http') ? url.trim() : 'https://' + url.trim());
    }

    function logout() { sessionStorage.clear(); localStorage.clear(); location.reload(); }

    window.onload = () => { 
        if (sessionStorage.getItem('isLoggedIn') === 'true') startSystem(); 
    };
</script>
</body>
</html>
