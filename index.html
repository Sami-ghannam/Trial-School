<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العنقود الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; --danger-dark: #b91c1c;
            --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --gray: #94a3b8;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 0; min-height: 100vh; }
        
        /* شاشة الترحيب الأصلية */
        .welcome-page { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; gap: 20px; padding: 15px; }
        @media (min-width: 1024px) { .welcome-page { flex-direction: row; gap: 30px; } }
        .side-widget { width: 100%; max-width: 300px; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0; }
        @media (min-width: 1024px) { .side-widget { width: 220px; } }
        .welcome-frame { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); padding: 10px; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); width: 100%; max-width: 500px; }
        .auth-card, .inner-app-content { background: var(--card); padding: 30px 20px; border-radius: 32px; text-align: center; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        /* العلامة المائية الأصلية */
        .auth-card::before, .inner-app-content::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('logo.png'); background-size: 70%; background-repeat: no-repeat; background-position: center; opacity: 0.08; z-index: 0; pointer-events: none; }

        .curved-title-container { width: 100%; height: 100px; display: flex; justify-content: center; }
        .curved-svg { width: 100%; height: 100%; }
        .curved-text { font-size: 34px; font-weight: 900; fill: var(--primary); }
        .designer-tag { font-size: 0.9rem; color: #64748b; margin-bottom: 25px; background: #f8fafc; padding: 6px 15px; border-radius: 50px; border: 1px solid #e2e8f0; position: relative; z-index: 1; }

        input[type="text"], select { width: 100%; padding: 14px; border-radius: 15px; border: 2px solid #e2e8f0; margin-bottom: 12px; outline: none; text-align: center; font-size: 1rem; position: relative; z-index: 1; }

        /* الأزرار ثلاثية الأبعاد المطلوبة */
        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; font-size: 1.1rem; transition: 0.1s; position: relative; z-index: 1; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 6px 0 #1d4ed8; }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d4ed8; }
        .btn-exit { background: var(--danger); color: white; box-shadow: 0 6px 0 var(--danger-dark); }
        .btn-exit:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--danger-dark); }

        /* تنسيق البطاقات القديم */
        #mainApp { display: none; padding: 15px; }
        .lesson-card { border-radius: 18px; padding: 15px; margin-bottom: 12px; border: 2px solid #e2e8f0; position: relative; z-index: 1; text-align: right; width: 100%; box-sizing: border-box; }
        
        /* الجدول السفلي (الذي تم حذفه بالخطأ) */
        .summary-area { width: 100%; margin-top: 25px; border-top: 4px solid var(--primary); padding-top: 15px; position: relative; z-index: 1; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: white; }
        .data-table th, .data-table td { padding: 10px; border: 1px solid #eee; text-align: center; }
        .status-pill { padding: 4px 8px; border-radius: 6px; color: white; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="welcome-page">
        <div class="side-widget">
            <div class="live-clock" style="font-size:1.3rem; font-weight:bold; color:var(--primary);">00:00:00</div>
            <div class="live-date" style="font-size:0.85rem; color:#64748b;">--/--/----</div>
        </div>
        <div class="welcome-frame">
            <div class="auth-card">
                <div class="curved-title-container">
                    <svg viewBox="0 0 500 120" class="curved-svg"><path id="curvePath" d="M 50,100 A 200,80 0 0,1 450,100" fill="none" /><text class="curved-text"><textPath xlink:href="#curvePath" startOffset="50%" text-anchor="middle">منصة العنقود الرقمية</textPath></text></svg>
                </div>
                <div class="designer-tag">بإشراف المشرف التربوي: سامي غنام</div>
                <div style="width: 100%; max-width: 320px;">
                    <input type="text" id="sysPass" placeholder="أدخل رمز الدخول">
                    <button class="btn btn-primary" onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> دخول للمنصة</button>
                    <button class="btn btn-exit" onclick="window.close()"><i class="fas fa-power-off"></i> خروج نهائي</button>
                </div>
            </div>
        </div>
        <div class="side-widget">
            <div class="quick-link" onclick="alert('الرموز: طالب 1، معلم 1111، مشرف 1234')"><i class="fas fa-info-circle"></i> التعليمات</div>
            <a href="https://wa.me/972568402800" style="text-decoration:none; color:inherit; display:block; margin-top:10px;"><i class="fab fa-whatsapp"></i> المطور</a>
        </div>
    </div>
</div>

<div id="mainApp">
    <div class="welcome-frame" style="max-width: 800px; margin: 0 auto;">
        <div class="inner-app-content">
            <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:15px;">
                <h4 style="margin:0;">بوابة الحصص</h4>
                <button onclick="location.reload()" style="border:none; background:none; cursor:pointer; color:var(--danger);">خروج</button>
            </div>
            <select id="daySelect" onchange="updateUI()"></select>
            <select id="gradeSelect" onchange="updateUI()">
                <option value="">إختر الصف...</option>
                <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">${i}</option>`)</script>
            </select>
            <div id="lessonsGrid" style="width:100%;"></div>
            <div id="summaryArea" class="summary-area"></div>
        </div>
    </div>
</div>

<script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8Yk6Sq2bCZtlrH-mgqDZFYnRc54MYf8vAW6VIpW1WHIzKi5lkoBRTXjv5i8sXBkHMrbR_KHS-kMoV/pub?gid=0&single=true&output=csv';
    let rawData = [];
    const weekDaysArr = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
    
    const daySelect = document.getElementById('daySelect');
    weekDaysArr.forEach(d => { daySelect.innerHTML += `<option value="${d}">${d}</option>`; });

    function updateTime() {
        const now = new Date();
        document.querySelectorAll('.live-clock').forEach(el => el.innerText = now.toLocaleTimeString('ar-EG'));
        document.querySelectorAll('.live-date').forEach(el => el.innerText = now.toLocaleDateString('ar-EG'));
    }
    setInterval(updateTime, 1000); updateTime();

    function timeToVal(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }

    async function loadData() {
        const r = await fetch(sheetURL + '&t=' + Date.now());
        const t = await r.text();
        rawData = t.split('\n').slice(1).map(row => {
            const c = row.split(',');
            return { day: c[0].trim(), grade: c[1].trim(), sub: c[2].trim(), teacher: c[3].trim(), s: c[4].trim(), e: c[5].trim(), link: c[6].trim() };
        });
        updateUI();
    }

    function handleLogin() {
        const pass = document.getElementById('sysPass').value.trim();
        if (["1", "1111", "1234"].includes(pass)) {
            sessionStorage.setItem('role', pass === "1234" ? 'supervisor' : 'user');
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadData();
        } else alert("الرمز خطأ");
    }

    function updateUI() {
        const role = sessionStorage.getItem('role');
        const day = daySelect.value;
        const grade = document.getElementById('gradeSelect').value;
        const grid = document.getElementById('lessonsGrid');
        const summary = document.getElementById('summaryArea');
        const now = new Date();
        const curMins = now.getHours() * 60 + now.getMinutes();
        const curDay = weekDaysArr[now.getDay()] || "الجمعة";

        let filtered = grade ? rawData.filter(i => i.day === day && i.grade === grade) : (role === 'supervisor' ? rawData.filter(i => i.day === day) : []);
        
        grid.innerHTML = "";
        filtered.forEach(l => {
            const start = timeToVal(l.s), end = timeToVal(l.e);
            let btn = "";
            if (role === 'supervisor' || (curDay === l.day && curMins >= start && curMins <= end)) {
                btn = `<button class="btn btn-primary" style="padding:10px; font-size:0.9rem;" onclick="window.open('${l.link}')">دخول الحصة</button>`;
            } else {
                btn = `<div style="color:var(--gray); font-size:0.8rem;">🔒 الرابط يظهر في موعد الحصة</div>`;
            }
            grid.innerHTML += `<div class="lesson-card"><b>${l.sub}</b><br><small>${l.teacher} | ${l.s}-${l.e}</small><br>${btn}</div>`;
        });

        if (filtered.length > 0) {
            summary.innerHTML = `<h5>📊 ملخص الجدول</h5><table class="data-table"><tr><th>المادة</th><th>الوقت</th><th>الحالة</th></tr>
            ${filtered.map(l => {
                const s = timeToVal(l.s), e = timeToVal(l.e);
                let status = (curDay === l.day && curMins >= s && curMins <= e) ? '<span class="status-pill" style="background:var(--success)">جارية</span>' : '<span class="status-pill" style="background:var(--gray)">انتظار</span>';
                return `<tr><td>${l.sub}</td><td>${l.s}</td><td>${status}</td></tr>`;
            }).join('')}</table>`;
        } else summary.innerHTML = "";
    }
</script>
</body>
</html>
