<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة جنوب الخليل الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444;
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --gray: #94a3b8;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 750px; margin: 0 auto; }
        
        .auth-card { background: var(--card); padding: 40px 30px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; margin-top: 40px; position: relative; }
        
        /* معالجة الشعار */
        .logo-wrapper { width: 130px; height: 130px; margin: 0 auto 20px; background: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .logo-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .lesson-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .active-now { border: 2px solid var(--success); background: #f0fdf4; }
        
        /* أزرار الحالة */
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-open { background: var(--primary); color: white; }
        .btn-locked { background: var(--gray); color: white; cursor: not-allowed; opacity: 0.7; }
        .btn-ended { background: #fee2e2; color: var(--danger); cursor: not-allowed; }

        .status-badge { font-size: 0.85rem; font-weight: bold; margin-top: 8px; display: block; }
        
        #mainApp { display: none; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" class="auth-card">
        <div class="logo-wrapper">
            <img src="شعار نهائي.png" alt="الشعار" onerror="this.src='https://via.placeholder.com/150?text=LOGO'">
        </div>
        <h2>منصة جنوب الخليل الرقمية</h2>
        <input type="text" id="passCode" placeholder="أدخل الرمز">
        <button class="btn btn-open" onclick="login()">دخول</button>
    </div>

    <div id="mainApp">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <h3>جدول الحصص الذكي</h3>
            <button onclick="location.reload()" style="color:red; border:none; background:none; cursor:pointer;">خروج</button>
        </div>
        <div id="filters" style="background:white; padding:15px; border-radius:15px; margin-bottom:20px;">
            <select id="daySelect" onchange="updateUI()"><option value="الأحد">الأحد</option><option value="الاثنين">الاثنين</option><option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option><option value="الخميس">الخميس</option></select>
            <select id="gradeSelect" onchange="updateUI()"><option value="">اختر الصف...</option><script>for(let i=1;i<=12;i++)document.write(`<option value="${i}">${i}</option>`)</script></select>
        </div>
        <div id="grid"></div>
    </div>
</div>

<script>
    const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtOpsreNoUoEcco1MnGhOu4ml8F-hRvKC-2AeVAJgodZdBBJ-l9OeWG1Xu_2l_tUY-qebr1h-xEWSb/pub?gid=1011079660&single=true&output=csv';
    let data = [];

    function login() {
        const p = document.getElementById('passCode').value;
        if(["1234", "5678", "123456789"].includes(p)) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadData();
        } else alert("خطأ في الرمز");
    }

    async function loadData() {
        const r = await fetch(url + '&t=' + Date.now());
        const t = await r.text();
        data = t.split('\n').slice(1).map(row => {
            const c = row.split(',');
            return { day: c[0].trim(), grade: c[1].trim(), sub: c[2].trim(), teacher: c[3].trim(), s: c[4].trim(), e: c[5].trim(), link: c[6].trim() };
        });
        updateUI();
        setInterval(updateUI, 30000); // تحديث الحالة كل 30 ثانية
    }

    function updateUI() {
        const grid = document.getElementById('grid');
        const day = document.getElementById('daySelect').value;
        const grade = document.getElementById('gradeSelect').value;
        if(!grade) return;

        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();

        let list = data.filter(i => i.day === day && i.grade === grade);
        grid.innerHTML = "";

        list.forEach(l => {
            const startM = getMins(l.s);
            const endM = getMins(l.e);
            
            let status = "locked"; // مغلق
            let btnText = "الرابط مغلق حالياً";
            let btnClass = "btn-locked";

            // فحص التوقيت (10 دقائق قبل، و 2 دقيقة بعد)
            if (nowMins >= (startM - 10) && nowMins <= (endM + 2)) {
                status = "open";
                btnText = "دخول الحصة الآن";
                btnClass = "btn-open";
            } else if (nowMins > (endM + 2)) {
                status = "ended";
                btnText = "انتهى وقت الحصة";
                btnClass = "btn-ended";
            } else {
                btnText = `يفتح الساعة ${l.s}`;
            }

            grid.innerHTML += `
                <div class="lesson-card ${status === 'open' ? 'active-now' : ''}">
                    <h3 style="margin:0">${l.sub}</h3>
                    <p>المعلم: ${l.teacher} | الوقت: ${l.s} - ${l.e}</p>
                    <button class="btn ${btnClass}" 
                        ${status === 'open' ? `onclick="window.open('${l.link}')"` : 'disabled'}>
                        ${btnText}
                    </button>
                    ${status === 'open' ? '<span class="status-badge" style="color:var(--success)">● متاحة الآن</span>' : ''}
                </div>`;
        });
    }

    function getMins(t) {
        if(!t) return 0;
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
    }
</script>
</body>
</html>
