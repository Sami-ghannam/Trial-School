<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>منصة التعلم عن بعد الشاملة</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        .auth-card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 50px;
        }

        .filter-section {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        select, input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
        }

        .lesson-card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: 0.3s ease;
        }

        .active-lesson {
            border: 2px solid var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
            background: #f0fdf4;
        }

        .progress-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: #f1f5f9;
        }

        .progress-bar {
            height: 100%;
            background: var(--success); width: 0%;
            transition: width 1s linear;
        }

        .btn {
            display: block;
            width: 100%; padding: 14px;
            border-radius: 12px; border: none; font-weight: bold;
            cursor: pointer; text-decoration: none; text-align: center;
            margin-top: 10px; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--primary); color: var(--primary); background: none; }

        .attendance-log {
            background: #fff;
            border-radius: 15px; padding: 15px;
            margin-top: 20px; border: 1px dashed #cbd5e1;
            max-height: 400px; overflow-y: auto;
        }
        
        label { font-size: 0.85rem; font-weight: bold; color: var(--primary); }
        .no-data { text-align: center; padding: 20px; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" class="auth-card">
        <h2>👋 مرحباً بك</h2>
        <p>أدخل الرمز للدخول (طالب: 1234 | معلم: 5678)</p>
        <input type="text" id="passCode" placeholder="الرمز السري">
        <button class="btn btn-primary" onclick="handleLogin()">دخول النظام</button>
    </div>

    <div id="mainApp" style="display:none;">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h2 id="appTitle">جاري تحميل البيانات...</h2>
            <button onclick="logout()" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:bold;">خروج</button>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <div>
                    <label>📅 اليوم:</label>
                    <select id="daySelect" onchange="updateUI()">
                        <option value="">---</option>
                        <option value="الأحد">الأحد</option>
                        <option value="الاثنين">الاثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                        <option value="الخميس">الخميس</option>
                    </select>
                </div>
                <div>
                    <label>🎓 الصف:</label>
                    <select id="gradeSelect" onchange="updateUI()">
                        <option value="">---</option>
                        <option value="1">الأول</option>
                        <option value="2">الثاني</option>
                        <option value="3">الثالث</option>
                        <option value="4">الرابع</option>
                        <option value="5">الخامس</option>
                        <option value="6">السادس</option>
                        <option value="7">السابع</option>
                        <option value="8">الثامن</option>
                        <option value="9">التاسع</option>
                        <option value="10">العاشر</option>
                    </select>
                </div>
            </div>

            <div id="teacherFiltersSection" style="display:none;">
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                <div class="filter-group">
                    <div>
                        <label>📚 المادة:</label>
                        <select id="subjectFilter" onchange="updateUI()">
                            <option value="">--- الكل ---</option>
                        </select>
                    </div>
                    <div>
                        <label>👨‍🏫 المعلم:</label>
                        <select id="teacherFilter" onchange="updateUI()">
                            <option value="">--- الكل ---</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="lessonsGrid"></div>

        <div id="teacherPanel" style="display:none; margin-top: 30px;">
            <hr>
            <h3>📊 سجل الحضور الذكي</h3>
            <button class="btn btn-outline" onclick="showAttendance()">تحديث وعرض سجل الحضور</button>
            <div id="attendanceDisplay" class="attendance-log" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtOpsreNoUoEcco1MnGhOu4ml8F-hRvKC-2AeVAJgodZdBBJ-l9OeWG1Xu_2l_tUY-qebr1h-xEWSb/pub?gid=1011079660&single=true&output=csv';
    
    let rawData = []; 

    // دالة تحويل الأرقام العربية إلى إنجليزية
    function convertArabicToEnglish(str) {
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) {
            str = str.replace(arabicNumbers[i], i);
        }
        return str;
    }

    // دالة تنظيف النص للمقارنة
    function clean(text) {
        if (!text) return "";
        return text.toString().trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/\s+/g, '');
    }

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetURL + '?cache=' + Date.now());
            const data = await response.text();
            parseCSV(data);
        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
        }
    }

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        rawData = [];
        let subjectsSet = new Set();
        let teachersSet = new Set();

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length >= 7) {
                const lesson = {
                    day: cols[0].trim(),
                    grade: convertArabicToEnglish(cols[1].trim()), // دعم الأرقام العربية بالجدول
                    subject: cols[2].trim(),
                    teacher: cols[3].trim(),
                    start: cols[4].trim(),
                    end: cols[5].trim(),
                    link: cols[6].trim()
                };
                rawData.push(lesson);
                subjectsSet.add(lesson.subject);
                teachersSet.add(lesson.teacher);
            }
        }
        
        populateDropdown('subjectFilter', subjectsSet);
        populateDropdown('teacherFilter', teachersSet);
        updateUI();
    }

    function populateDropdown(id, dataSet) {
        const select = document.getElementById(id);
        if(!select) return;
        const currentValue = select.value;
        select.innerHTML = '<option value="">--- الكل ---</option>';
        dataSet.forEach(item => {
            if(item) select.innerHTML += `<option value="${item}">${item}</option>`;
        });
        select.value = currentValue;
    }

    function handleLogin() {
        let code = document.getElementById('passCode').value;
        code = convertArabicToEnglish(code.trim()); // تحويل المدخلات فوراً

        let role = '';
        if (code === "1234") role = 'student';
        else if (code === "5678") role = 'teacher';

        if (role) {
            localStorage.setItem('user_role', role);
            startSystem();
        } else {
            alert("الرمز غير صحيح!");
        }
    }

    async function startSystem() {
        const role = localStorage.getItem('user_role');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        
        if (role === 'teacher') {
            document.getElementById('teacherPanel').style.display = 'block';
            document.getElementById('teacherFiltersSection').style.display = 'block';
            document.getElementById('appTitle').innerText = "لوحة التحكم 👨‍🏫";
        } else {
            document.getElementById('teacherFiltersSection').style.display = 'none';
            document.getElementById('appTitle').innerText = "الجدول الدراسي 🎓";
        }

        await fetchSheetData();
        setInterval(updateUI, 20000);
    }

    function updateUI() {
        const grid = document.getElementById('lessonsGrid');
        if (!grid) return;
        
        const selectedDay = clean(document.getElementById('daySelect').value);
        const selectedGrade = convertArabicToEnglish(document.getElementById('gradeSelect').value);
        
        // إفراغ الشبكة إذا لم يتم اختيار يوم أو صف
        if (!selectedDay || !selectedGrade) {
            grid.innerHTML = '<p class="no-data">يرجى اختيار اليوم والصف لعرض الحصص.</p>';
            return;
        }

        const filterSubject = document.getElementById('subjectFilter').value;
        const filterTeacher = document.getElementById('teacherFilter').value;
        const role = localStorage.getItem('user_role');

        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();

        let filtered = rawData.filter(item => clean(item.day) === selectedDay && item.grade === selectedGrade);

        // تطبيق فلاتر المعلم الإضافية فقط إذا كان المستخدم معلماً
        if (role === 'teacher') {
            if (filterSubject !== "") filtered = filtered.filter(item => item.subject === filterSubject);
            if (filterTeacher !== "") filtered = filtered.filter(item => item.teacher === filterTeacher);
        }

        grid.innerHTML = filtered.length ? '' : '<p class="no-data">لا توجد حصص مجدولة لهذا الاختيار.</p>';

        filtered.forEach(lesson => {
            const [sH, sM] = lesson.start.split(':').map(Number);
            const [eH, eM] = lesson.end.split(':').map(Number);
            const startTotal = sH * 60 + sM;
            const endTotal = eH * 60 + eM;
            const isActive = nowMins >= startTotal && nowMins < endTotal;

            const card = document.createElement('div');
            card.className = `lesson-card ${isActive ? 'active-lesson' : ''}`;
            
            let progressHtml = '';
            if (isActive) {
                const pct = Math.min(100, Math.max(0, ((nowMins - startTotal) / (endTotal - startTotal)) * 100));
                progressHtml = `<div class="progress-container"><div class="progress-bar" style="width:${pct}%"></div></div>`;
            }

            card.innerHTML = `
                ${progressHtml}
                <h3 style="margin:0">${lesson.subject}</h3>
                <p style="color:gray; font-size:0.9rem; margin:5px 0;">👨‍🏫 ${lesson.teacher}</p>
                <p style="margin:5px 0;">⏰ ${lesson.start} - ${lesson.end}</p>
                <button class="btn btn-primary" onclick="joinSession('${lesson.subject}', '${lesson.link}')">🚀 دخول الحصة</button>
            `;
            grid.appendChild(card);
        });
    }

    function joinSession(subject, url) {
        const finalUrl = url.trim().startsWith('http') ? url.trim() : 'https://' + url.trim();
        // فتح الرابط بطريقة تتجاوز بعض تحذيرات الأمن
        const win = window.open('', '_blank');
        win.opener = null;
        win.location.replace(finalUrl);
    }

    function showAttendance() {
        const display = document.getElementById('attendanceDisplay');
        const logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
        display.style.display = 'block';
        if (logs.length === 0) { display.innerHTML = "لا يوجد سجل حضور حالياً."; return; }
        display.innerHTML = '<h4>قائمة الحضور:</h4>';
        logs.forEach(log => {
            display.innerHTML += `• ${log.name} - ${log.subject} (${log.time})<br>`;
        });
    }

    function logout() { localStorage.clear(); location.reload(); }
    
    window.onload = () => {
        if (localStorage.getItem('user_role')) startSystem();
    };
</script>
</body>
</html>
